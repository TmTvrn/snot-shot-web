<style>

<script type="module">
import * as THREE from 'three';
import GUI from 'lil-gui';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ======================= TUNING (port to UE as one FSnotTuning struct) =======================
const DEFAULTS = {
  walkSpeed: 5.5,
  dashSpeed: 27,                     // left click: instant launch toward the cursor
  chargeDelay: 0.15, chargeTime: 0.55, chargedSpeed: 44,            // launch on release; holding past the delay charges a bigger launch
  heroDrag: 2.6, heroDecel: 5, glideSteer: 10, heroWallRest: 0.7,   // you keep gliding after a dash
  attackSpeed: 10,                   // above this speed you knock viruses; below it they hurt you
  hitSlow: 0.7, maxKnock: 24,        // share of head-on momentum lost on a hit; max speed given to a virus
  maxPips: 3, pipRegen: 0.75,        // dash charges; a hit refunds one
  sneezeMax: 3, sneezePerHit: 0.25, sneezePerPot: 0.5,  // sneeze charges gained per dash hit and per pot
  sneezeRange: 7, sneezeKnock: 18, sneezeArc: 0.8,                  // right click: gust cone (arc = half-angle, radians)
  heroRadius: 0.5, hearts: 5, invuln: 1.7,
  ballDrag: 0.55, ballDecel: 1.4, ballRest: 0.9, wallRest: 0.8,
  tilt: 2.2, rampPull: 7,            // table tilt toward the nostril (rolling balls only)
  holeRadius: 1.05, suckRadius: 2.6, suck: 22,
  comboWindow: 2.5,
  floaterSpeed: 2.3, speedUp: 0.7,   // floaters never stop; they speed up as their numbers drop
  shotSpeed: 6.5, shotCooldown: 4.5, // floaters spit snot at you
  crawlSpeed: 3.0, lungeMult: 3.2,                                  // centipede: crawl speed and lunge speed multiplier
  bubblerSpeed: 1.9, bubbleRegen: 6, zapRadius: 2.8,                // jellyfish: chase speed, bubble regrow time, shock radius
  windForce: 9,                      // nostril breathing strength
  bumperKick: 13, poolDrag: 4, ventForce: 14,
  bossHp: 6, bossHalfHp: 2,          // hits before the boss splits, and before each half splits again
  bloom: 0.35, timeScale: 1,
};
const CFG = { ...DEFAULTS };
try { Object.assign(CFG, JSON.parse(localStorage.getItem('snotCfg10') || '{}')); } catch {}
const saveCfg = () => { try { localStorage.setItem('snotCfg10', JSON.stringify(CFG)); } catch {} };

// ======================= HELPERS =======================
const V2 = (x = 0, y = 0) => new THREE.Vector2(x, y);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const S2 = Math.SQRT1_2;
// Sim plane is (x, z). u = screen-right, w = screen-up (away from camera) for the iso view.
const RX = S2, RZ = -S2, UX = -S2, UZ = -S2;
const uOf = (x, z) => x * RX + z * RZ, wOf = (x, z) => x * UX + z * UZ;
const uw = (u, w) => V2(RX * u + UX * w, RZ * u + UZ * w);
const P = 8, CR = 3.1, KS = P / 6.6;                       // playfield half-extent, corner radius
const HOLE = uw(0, -((P - CR) * Math.SQRT2 + CR) + 2.0);                      // the nostril: pot viruses here
const START = uw(0, -3.6);

// ---- terrain: stacked floors (tiers) joined by ramps. Steps up are walls, drops are free. No allocations.
const RW = 3.3;                                // ramp width
const LAYOUTS = [   // coordinates are in the original 6.6-unit design space, scaled up by KS
  { tiers: [], ramps: [] },
  { tiers: [{ zMax: -0.8 * KS, xMax: 99, h: 2.2 }, { zMax: 2.4 * KS, xMax: -3.2 * KS, h: 2.2 }],        // stage 2: an L-shaped upper gallery around a sunken pit
    ramps: [{ axis: 'z', lo: 2.6 * KS, hi: -0.8 * KS, a0: P - RW, a1: P, h0: 0, h1: 2.2 }] },
  { tiers: [{ zMax: -1.2 * KS, xMax: 99, h: 1.6 }, { zMax: 2.6 * KS, xMax: -4.0 * KS, h: 1.6 }, { zMax: -3.0 * KS, xMax: -0.2 * KS, h: 3.2 }],   // stage 3 + boss: a roomy pit, a slim left gallery, and a small high plateau in the far corner
    ramps: [{ axis: 'z', lo: 2.2 * KS, hi: -1.2 * KS, a0: P - RW, a1: P, h0: 0, h1: 1.6 }, { axis: 'x', lo: 3.0 * KS, hi: -0.2 * KS, a0: -P, a1: -P + RW, h0: 1.6, h1: 3.2 }] },
  { tiers: [{ zMax: 0.8 * KS, xMax: 99, h: 1.8 }],                                                      // boss stage: a wide upper arena for it to bounce around, the nostril on the floor below
    ramps: [{ axis: 'z', lo: 3.2 * KS, hi: 0.8 * KS, a0: P - RW, a1: P, h0: 0, h1: 1.8 }, { axis: 'z', lo: 3.2 * KS, hi: 0.8 * KS, a0: -P, a1: -P + RW, h0: 0, h1: 1.8 }] },   // a ramp on each side, so there is always a way up and a way out
];
let TIERS = [], RAMPS = [], maxH = 0;
function rampAt(x, z) { for (let i = 0; i < RAMPS.length; i++) { const r = RAMPS[i], c = r.axis === 'z' ? z : x, a = r.axis === 'z' ? x : z; if (a >= r.a0 && a <= r.a1 && c <= r.lo && c >= r.hi) return i; } return -1; }
function groundH(x, z) {
  let h = 0;
  for (let i = 0; i < TIERS.length; i++) { const t = TIERS[i]; if (z <= t.zMax && x <= t.xMax) h = t.h; }
  const ri = rampAt(x, z); if (ri >= 0) { const r = RAMPS[ri], hr = lerp(r.h0, r.h1, (r.lo - (r.axis === 'z' ? z : x)) / (r.lo - r.hi)); if (hr > h) h = hr; }
  return h;
}
const TR = { x: 0, z: 0, gh: 0, hit: false, nx: 0, nz: 0 };
// try to move from (x,z) standing at height gh to (nx,nz). Steps up > 0.3 are walls; drops are free.
function terrainMove(x, z, nx, nz, gh) {
  const nh = groundH(nx, nz);
  if (nh - gh <= 0.3) { TR.hit = false; TR.x = nx; TR.z = nz; TR.gh = nh; return; }
  TR.hit = true; TR.x = x; TR.z = z; TR.gh = gh;
  const bx = groundH(nx, z) - gh > 0.3, bz = groundH(x, nz) - gh > 0.3;
  const ax = (bx || !bz) ? -Math.sign(nx - x) : 0, az = (bz || !bx) ? -Math.sign(nz - z) : 0, l = Math.hypot(ax, az) || 1;
  TR.nx = ax / l; TR.nz = az / l;
}
// after positional pushes a body can end up embedded in a step: move it to the nearest free spot
function terrainFix(x, z, gh) {
  const nh = groundH(x, z); TR.x = x; TR.z = z; TR.gh = gh;
  if (nh - gh <= 0.3) { if (nh < gh) TR.gh = nh; return; }
  for (let d = 0.15; d < 1.6; d += 0.15) for (let k = 0; k < 4; k++) { const tx = x + (k === 0 ? d : k === 1 ? -d : 0), tz = z + (k === 2 ? d : k === 3 ? -d : 0); if (groundH(tx, tz) - gh <= 0.3) { TR.x = tx; TR.z = tz; return; } }
  TR.gh = nh;
}
// circle vs rounded-square arena; writes result into AC
const AC = { x: 0, z: 0, hit: false, nx: 0, nz: 0 };
function arenaClamp(x, z, r) {
  const b = P - CR, qx = Math.abs(x) - b, qz = Math.abs(z) - b; AC.hit = false; AC.x = x; AC.z = z; AC.nx = 0; AC.nz = 0;
  if (qx > 0 && qz > 0) {
    const l = Math.hypot(qx, qz), pen = l - (CR - r);
    if (pen > 0) { AC.nx = -Math.sign(x) * qx / l; AC.nz = -Math.sign(z) * qz / l; AC.x += AC.nx * pen; AC.z += AC.nz * pen; AC.hit = true; }
  } else {
    if (Math.abs(x) > P - r) { AC.nx = -Math.sign(x); AC.x = Math.sign(x) * (P - r); AC.hit = true; }
    if (Math.abs(z) > P - r) { AC.nz = -Math.sign(z); AC.z = Math.sign(z) * (P - r); AC.hit = true; }
    if (AC.hit) { const l = Math.hypot(AC.nx, AC.nz); AC.nx /= l; AC.nz /= l; }
  }
}
function insideArena(x, z, m) {
  const b = P - CR, qx = Math.abs(x) - b, qz = Math.abs(z) - b;
  if (qx > 0 && qz > 0) return Math.hypot(qx, qz) < CR - m;
  return Math.abs(x) < P - m && Math.abs(z) < P - m;
}

// ======================= RENDERER / CAMERA =======================
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
{ const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 120, 10, 128, 128, 190);
  grd.addColorStop(0, '#2b4a5c'); grd.addColorStop(0.6, '#12222e'); grd.addColorStop(1, '#070b10');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);
const CAM_DIR = new THREE.Vector3(1, 1.12, 1).normalize();
let viewH = 18, zoom = 1, shake = 0, camTall = 0;
const camTarget = new THREE.Vector3(0, -0.2, 0);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), CFG.bloom, 0.5, 1.0);
composer.addPass(bloom); composer.addPass(new OutputPass());
function resize() { renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); viewH = Math.max(22, 30 / (innerWidth / innerHeight)); }
addEventListener('resize', resize); resize();
function updateCamera() {
  const a = innerWidth / innerHeight, h = (viewH + camTall * 0.9) * zoom / 2;
  camera.left = -h * a; camera.right = h * a; camera.top = h; camera.bottom = -h; camera.updateProjectionMatrix();
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  camera.position.copy(camTarget).addScaledVector(CAM_DIR, 60); camera.position.x += sx; camera.position.y += sy;
  camera.lookAt(camTarget.x + sx, camTarget.y + sy, camTarget.z);
}
scene.add(new THREE.HemisphereLight(0xffd0dc, 0x30101c, 0.45));
const keyLight = new THREE.DirectionalLight(0xfff0dc, 1.7);
keyLight.position.set(-7, 16, 5); keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048); keyLight.shadow.bias = -0.0006; keyLight.shadow.normalBias = 0.03;
