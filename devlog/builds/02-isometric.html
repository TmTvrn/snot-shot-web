<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snot Ninja Prototype</title>
<style>
  html,body{margin:0;height:100%;background:#0b1016;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:absolute;inset:0;touch-action:none}
  #hud{position:absolute;inset:0;pointer-events:none;font-weight:800;text-shadow:0 2px 0 #000a,0 0 8px #000a}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,#000a 100%)}
  #focus{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,#062a 100%);opacity:0;transition:opacity .12s}
  #tl{position:absolute;top:14px;left:18px;font-size:20px;letter-spacing:2px}
  #tl small{display:block;font-size:13px;letter-spacing:1px;color:#ffd9e2;margin-top:4px}
  #score{position:absolute;top:14px;right:18px;font-size:26px;font-variant-numeric:tabular-nums}
  #abil{position:absolute;top:52px;right:18px;font-size:12px;line-height:1.6;color:#d6ffe0;text-align:right;font-weight:600}
  #bottom{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:min(420px,80vw);font-size:11px;letter-spacing:2px}
  #pips{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
  .pip{width:34px;height:10px;border-radius:6px;background:#0008;border:2px solid #000;overflow:hidden}
  .pip>i{display:block;height:100%;background:#ffe14a;border-radius:4px}
  .bar{height:9px;background:#0008;border:2px solid #000;border-radius:6px;margin:2px 0 6px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:4px}
  #mass>i{background:linear-gradient(90deg,#c8f04a,#7aa82a)}
  #meter>i{background:linear-gradient(90deg,#7df,#fff)}
  #meter.hot>i{animation:hot .25s infinite alternate}
  @keyframes hot{to{filter:brightness(1.8)}}
  #combo{position:absolute;font-size:30px;color:#ffe14a;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s}
  #caption{position:absolute;left:50%;top:12%;transform:translateX(-50%);max-width:80vw;text-align:center;font-size:24px;line-height:1.25;opacity:0;transition:opacity .25s;background:#000a;padding:10px 22px;border-radius:12px;border:2px solid #fff3;text-shadow:none}
  #caption small{display:block;font-size:11px;color:#ff9db3;letter-spacing:3px;margin-bottom:3px}
  .pop{position:absolute;font-size:18px;color:#fff;transform:translate(-50%,-50%);animation:pop .7s ease-out forwards;white-space:nowrap}
  .pop.big{font-size:28px;color:#ffe14a}
  @keyframes pop{0%{opacity:0;margin-top:0;scale:.5}15%{opacity:1;scale:1.25}100%{opacity:0;margin-top:-60px;scale:1}}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#060a10cc;padding:20px;box-sizing:border-box;pointer-events:auto;text-shadow:none}
  #overlay.hidden{display:none}
  #overlay h1{font-size:64px;margin:0 0 6px;color:#c8f04a;letter-spacing:3px;text-shadow:0 5px 0 #2a4a00,0 0 40px #9f48}
  #overlay h2{font-size:30px;margin:0 0 6px;color:#fff}
  #overlay p{margin:6px 0;font-weight:500;font-size:15px;color:#e8eef5;line-height:1.5}
  #overlay .go{margin-top:20px;color:#ffe14a;font-weight:800;font-size:18px;animation:hot .6s infinite alternate}
  .cards{display:flex;gap:14px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .card{width:170px;padding:16px 12px;border:3px solid #fff3;border-radius:14px;background:#2a0c18;font-size:13px;font-weight:500;cursor:pointer;line-height:1.4;transition:transform .1s}
  .card b{display:block;font-size:18px;margin-bottom:6px;color:#ffe14a}
  .card i{display:block;font-size:10px;letter-spacing:2px;color:#ff9db3;font-style:normal;margin-bottom:6px}
  .card.sel,.card:hover{border-color:#ffe14a;background:#4a1428;transform:translateY(-4px)}
  kbd{background:#fff2;border-radius:5px;padding:1px 7px;font-family:inherit;font-weight:700}
</style>
</head>
<body>
<div id="hud">
  <div id="vig"></div><div id="focus"></div>
  <div id="tl"><span id="scene">SCENE 1</span><small id="takes"></small></div>
  <div id="score">0</div>
  <div id="abil"></div>
  <div id="combo"></div>
  <div id="caption"></div>
  <div id="bottom">
    <div id="pips"></div>

    SNEEZE<div class="bar" id="meter"><i></i></div>
  </div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import GUI from 'lil-gui';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ======================= TUNING (port to UE as one FSnotTuning struct) =======================
const DEFAULTS = {
  chargeTime: 0.45,        // real seconds of hold for a full-power dash
  maxHold: 1.6,            // real seconds before a held dash auto-fires
  focusScale: 0.18,        // time scale while holding (slow-mo)
  dashMin: 13, dashMax: 27,// u/s
  drag: 1.6, decel: 3,     // exponential drag (1/s) + flat decel (u/s^2)
  attackSpeed: 7,          // above this speed you're a weapon; below it you're vulnerable
  maxPips: 3, pipRegen: 0.8, // dash charges and regen per second
  baseRadius: 0.5,
  growthPerKill: 0.05, speedPenaltyPerKill: 0.015, maxScale: 2.2, minSpeedMult: 0.65,
  sneezeMeter: 20, comboWindow: 2.2, sneezeRadius: 5.5,
  massLossPerHit: 4, invuln: 1.3, killGrace: 0.3,
  wallRest: 0.85, bumperBoost: 1.15, bumperMinSpeed: 17,
  floaterSpeed: 1.0, darterDash: 15, darterCooldown: 3.2, spikerCycle: 2.6,
  bossHp: 4, bossShieldDownTime: 7,
  takes: 3,
  bloom: 0.35, timeScale: 1, voice: true,
};
const CFG = { ...DEFAULTS };
try { Object.assign(CFG, JSON.parse(localStorage.getItem('snotCfg2') || '{}')); } catch {}
const saveCfg = () => { try { localStorage.setItem('snotCfg2', JSON.stringify(CFG)); } catch {} };

// ======================= HELPERS =======================
const V2 = (x = 0, y = 0) => new THREE.Vector2(x, y);
const rnd = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const S2 = Math.SQRT1_2;
// Screen-aligned ground axes for the iso camera (sim coords: x = world x, y = world z)
const RIGHT = V2(S2, -S2), UPV = V2(-S2, -S2);
const uw = (u, w) => V2(RIGHT.x * u + UPV.x * w, RIGHT.y * u + UPV.y * w);
const P = 6.6, CR = 2.6;   // playfield half-extent and corner radius

// circle vs rounded-square arena. Mutates p/vel, returns hit normal or null.
const _n = V2();
function arenaCollide(p, r, vel, rest) {
  const b = P - CR, qx = Math.abs(p.x) - b, qy = Math.abs(p.y) - b;
  let hit = false; _n.set(0, 0);
  if (qx > 0 && qy > 0) {
    const l = Math.hypot(qx, qy), pen = l - (CR - r);
    if (pen > 0) { _n.set(-Math.sign(p.x) * qx / l, -Math.sign(p.y) * qy / l); p.addScaledVector(_n, pen); hit = true; }
  } else {
    if (Math.abs(p.x) > P - r) { _n.x = -Math.sign(p.x); p.x = Math.sign(p.x) * (P - r); hit = true; }
    if (Math.abs(p.y) > P - r) { _n.y = -Math.sign(p.y); p.y = Math.sign(p.y) * (P - r); hit = true; }
    if (hit) _n.normalize();
  }
  if (!hit) return null;
  const vn = vel.dot(_n); if (vn < 0) vel.addScaledVector(_n, -(1 + rest) * vn);
  return _n;
}
function insideArena(p, m) {
  const b = P - CR, qx = Math.abs(p.x) - b, qy = Math.abs(p.y) - b;
  if (qx > 0 && qy > 0) return Math.hypot(qx, qy) < CR - m;
  return Math.abs(p.x) < P - m && Math.abs(p.y) < P - m;
}

// ======================= RENDERER / CAMERA =======================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
{ // backdrop gradient
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 120, 10, 128, 128, 190);
  grd.addColorStop(0, '#2b4a5c'); grd.addColorStop(0.6, '#12222e'); grd.addColorStop(1, '#070b10');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);
const CAM_DIR = new THREE.Vector3(1, 1.12, 1).normalize();
let viewH = 17, zoom = 1, shake = 0;
const camTarget = new THREE.Vector3(0, -0.6, 0);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), CFG.bloom, 0.5, 1.0);
composer.addPass(bloom); composer.addPass(new OutputPass());
function resize() {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  viewH = Math.max(17.5, 24.5 / (innerWidth / innerHeight));
}
addEventListener('resize', resize); resize();
function updateCamera() {
  const a = innerWidth / innerHeight, h = viewH * zoom / 2;
  camera.left = -h * a; camera.right = h * a; camera.top = h; camera.bottom = -h; camera.updateProjectionMatrix();
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  camera.position.copy(camTarget).addScaledVector(CAM_DIR, 60); camera.position.x += sx; camera.position.y += sy;
  camera.lookAt(camTarget.x + sx, camTarget.y + sy, camTarget.z);
}

scene.add(new THREE.HemisphereLight(0xffd0dc, 0x30101c, 0.45));
const keyLight = new THREE.DirectionalLight(0xfff0dc, 1.7);
keyLight.position.set(-7, 16, 5); keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048); keyLight.shadow.bias = -0.0006; keyLight.shadow.normalBias = 0.03;
Object.assign(keyLight.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 50 });
scene.add(keyLight);
const rim = new THREE.DirectionalLight(0x66d9ff, 0.8); rim.position.set(-8, 5, -10); scene.add(rim);

// ======================= DIORAMA =======================
function rrShape(half, rad) {
  const s = new THREE.Shape(), h = half, r = rad;
  s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.absarc(h - r, -h + r, r, -Math.PI / 2, 0);
  s.lineTo(h, h - r); s.absarc(h - r, h - r, r, 0, Math.PI / 2);
  s.lineTo(-h + r, h); s.absarc(-h + r, h - r, r, Math.PI / 2, Math.PI);
  s.lineTo(-h, -h + r); s.absarc(-h + r, -h + r, r, Math.PI, Math.PI * 1.5);
  return s;
}
// evenly spaced outline points of a rounded square (no duplicates)
function rrPoints(half, rad, perSide = 6, perArc = 8) {
  const out = [], b = half - rad;
  const corners = [[b, -b, -Math.PI / 2], [b, b, 0], [-b, b, Math.PI / 2], [-b, -b, Math.PI]];
  corners.forEach(([cx, cy, a0], i) => {
    for (let k = 0; k <= perArc; k++) { const a = a0 + (k / perArc) * Math.PI / 2; out.push(V2(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad)); }
    const s = out[out.length - 1], [nx, ny, na] = corners[(i + 1) % 4], e = V2(nx + Math.cos(na) * rad, ny + Math.sin(na) * rad);
    for (let k = 1; k < perSide; k++) out.push(V2(lerp(s.x, e.x, k / perSide), lerp(s.y, e.y, k / perSide)));
  });
  return out;
}
function fleshTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
  const grd = g.createRadialGradient(512, 512, 60, 512, 512, 740);
  grd.addColorStop(0, '#d9566f'); grd.addColorStop(0.7, '#b8344f'); grd.addColorStop(1, '#7c1a34');
  g.fillStyle = grd; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 300; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(255,190,200,0.05)' : 'rgba(120,20,50,0.05)';
    g.beginPath(); g.arc(rand(0, 1024), rand(0, 1024), rand(20, 100), 0, 7); g.fill();
  }
  const vein = (x, y, a, w, depth, col) => {
    const kids = []; g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y);
    for (let i = 0; i < 26; i++) {
      a += rand(-0.45, 0.45); x += Math.cos(a) * 20; y += Math.sin(a) * 20; g.lineTo(x, y);
      if (depth < 3 && Math.random() < 0.14) kids.push([x, y, a + rand(0.5, 1) * (Math.random() < 0.5 ? -1 : 1)]);
    }
    g.stroke(); kids.forEach(k => vein(k[0], k[1], k[2], w * 0.6, depth + 1, col));
  };
  for (let i = 0; i < 9; i++) { const a = rand(0, 6.28); vein(512 + Math.cos(a) * 560, 512 + Math.sin(a) * 560, a + Math.PI, rand(5, 9), 0, 'rgba(130,20,60,0.32)'); }
  for (let i = 0; i < 5; i++) { const a = rand(0, 6.28); vein(512 + Math.cos(a) * 560, 512 + Math.sin(a) * 560, a + Math.PI, rand(3, 6), 0, 'rgba(90,70,170,0.22)'); }
  for (let i = 0; i < 900; i++) { g.fillStyle = Math.random() < 0.6 ? 'rgba(90,10,40,0.25)' : 'rgba(255,220,225,0.35)'; g.beginPath(); g.arc(rand(0, 1024), rand(0, 1024), rand(1, 3), 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const floorMat = new THREE.MeshPhysicalMaterial({ map: fleshTexture(), roughness: 0.55, clearcoat: 0.35, clearcoatRoughness: 0.4, envMapIntensity: 0.25 });
{
  const half = P + 0.3, geo = new THREE.ShapeGeometry(rrShape(half, CR + 0.3), 24);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + half) / (2 * half), (pos.getY(i) + half) / (2 * half));
  geo.rotateX(-Math.PI / 2);
  const floor = new THREE.Mesh(geo, floorMat); floor.receiveShadow = true; scene.add(floor);
}
const lipMat = new THREE.MeshPhysicalMaterial({ color: 0xd9506e, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.25, envMapIntensity: 0.35, emissive: 0x501020, emissiveIntensity: 0.3 });
{ // wall lip
  const pts = rrPoints(P + 0.55, CR + 0.55).map(p => new THREE.Vector3(p.x, 0.3, p.y));
  const lip = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), 260, 0.62, 14, true), lipMat);
  lip.castShadow = lip.receiveShadow = true; scene.add(lip);
  // cutaway slab layers
  const layer = (half, rad, depth, y, color, rough) => {
    const g = new THREE.ExtrudeGeometry(rrShape(half, rad), { depth, bevelEnabled: true, bevelSize: 0.12, bevelThickness: 0.12, bevelSegments: 3, curveSegments: 18 });
    g.rotateX(Math.PI / 2);
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: rough, envMapIntensity: 0.15 })); m.position.y = y; m.receiveShadow = true; scene.add(m);
  };
  layer(P + 1.15, CR + 1.15, 1.1, -0.1, 0xa8324e, 0.6);
  layer(P + 0.95, CR + 0.95, 0.9, -1.35, 0x5c1428, 0.8);
  layer(P + 1.3, CR + 1.3, 0.45, -2.4, 0xb8a888, 0.8);
  // soft ground shadow
  const c = document.createElement('canvas'); c.width = c.height = 256; const g2 = c.getContext('2d');
  const grd = g2.createRadialGradient(128, 128, 20, 128, 128, 128); grd.addColorStop(0, 'rgba(0,0,0,0.75)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g2.fillStyle = grd; g2.fillRect(0, 0, 256, 256);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(34, 34), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = -3.4; scene.add(sh);
}
{ // nostril pit at the near corner
  const c = uw(0, -7.1);
  const pit = new THREE.Mesh(new THREE.CircleGeometry(1.25, 32), new THREE.MeshBasicMaterial({ color: 0x1a0308 }));
  pit.rotation.x = -Math.PI / 2; pit.position.set(c.x, 0.02, c.y); scene.add(pit);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.3, 0.22, 10, 32), lipMat); ring.rotation.x = Math.PI / 2; ring.position.set(c.x, 0.08, c.y); ring.castShadow = true; scene.add(ring);
}
// decorative wall hairs
const hairGeo = new THREE.ConeGeometry(0.07, 1.3, 5); hairGeo.translate(0, 0.65, 0);
const hairMat = new THREE.MeshStandardMaterial({ color: 0x3a1a16, roughness: 0.6 });
const HAIRS = rrPoints(P + 0.2, CR + 0.2, 7, 5).map((p, i) => ({ x: p.x, z: p.y, a: Math.atan2(p.y, p.x), s: rand(0.7, 1.3), ph: i * 0.9 }));
const hairs = new THREE.InstancedMesh(hairGeo, hairMat, HAIRS.length); hairs.castShadow = true; scene.add(hairs);
const _m4 = new THREE.Matrix4(), _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _e = new THREE.Euler(), _v3 = new THREE.Vector3(), _s3 = new THREE.Vector3();
const YAX = new THREE.Vector3(0, 1, 0);
function updateHairs(t) {
  HAIRS.forEach((h, i) => {
    const lean = 0.55 + Math.sin(t * 1.8 + h.ph) * 0.14;
    _q.setFromAxisAngle(YAX, -h.a); _q2.setFromEuler(_e.set(0, 0, lean)); _q.multiply(_q2);
    hairs.setMatrixAt(i, _m4.compose(_v3.set(h.x, 0.5, h.z), _q, _s3.setScalar(h.s)));
  });
  hairs.instanceMatrix.needsUpdate = true;
}

// ======================= FX POOLS =======================
const PMAX = 500, parts = [];
const pMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshBasicMaterial(), PMAX);
pMesh.frustumCulled = false; pMesh.count = 0; scene.add(pMesh);
const _col = new THREE.Color();
function burst(p, h, color, n = 10, spd = 6, size = 0.14, up = 5) {
  for (let i = 0; i < n && parts.length < PMAX; i++) {
    const a = Math.random() * 6.283, s = spd * rand(0.3, 1);
    parts.push({ x: p.x, y: h, z: p.y, vx: Math.cos(a) * s, vy: rand(0.3, 1) * up, vz: Math.sin(a) * s, life: rand(0.35, 0.8), size: size * rand(0.6, 1.3), color, g: 16 });
  }
}
function ghost(p, h, color, size, life = 0.22) { if (parts.length < PMAX) parts.push({ x: p.x, y: h, z: p.y, vx: 0, vy: 0, vz: 0, life, size, color, g: 0, ghost: life }); }
function stepParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.y < 0.08 && p.g) { p.y = 0.08; p.vy *= -0.4; p.vx *= 0.6; p.vz *= 0.6; }
  }
}
function drawParts() {
  pMesh.count = parts.length;
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], s = p.size * (p.ghost ? p.life / p.ghost : Math.min(1, p.life * 4));
    pMesh.setMatrixAt(i, _m4.makeScale(s, s, s).setPosition(p.x, p.y, p.z)); pMesh.setColorAt(i, _col.setHex(p.color));
  }
  pMesh.instanceMatrix.needsUpdate = true; if (pMesh.instanceColor) pMesh.instanceColor.needsUpdate = true;
}
// persistent slime splats on the floor
const SMAX = 180, splats = []; let splatI = 0;
const sMesh = new THREE.InstancedMesh(new THREE.CircleGeometry(1, 14).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ roughness: 0.3, transparent: true, opacity: 0.55, depthWrite: false, envMapIntensity: 0.2 }), SMAX);
sMesh.frustumCulled = false; sMesh.receiveShadow = true; scene.add(sMesh);
for (let i = 0; i < SMAX; i++) { splats.push({ x: 0, z: 0, s: 0, life: 0, rot: 0, sx: 1 }); sMesh.setMatrixAt(i, _m4.makeScale(0, 0, 0)); sMesh.setColorAt(i, _col.setHex(0xffffff)); }

  stats.maxCombo = Math.max(stats.maxCombo, hero.combo);

  popup(hero.combo > 1 ? `${pts}  x${hero.combo}` : `${pts}`, v.pos, hero.combo >= 5);
  if (v.type !== 'spore') hero.mass = Math.min(massCap(), hero.mass + 1);
